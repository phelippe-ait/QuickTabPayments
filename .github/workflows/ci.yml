name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run test
      - run: npm run build && npm run bundle:budget
      - run: node scripts/scan-secrets.mjs --dist
